  Changelog
  ---------
  2026-09-26  v1.0  File created. Puzzle generator with unique-solution check, four difficulty
                    levels, pencil notes, undo, hints, mistake counter, timer with pause,
                    autosave/resume, best times, keyboard controls, light/dark theme.
  2026-09-26  v1.0  Moved from Workflows/Sudoku/ to Apps/Sudoku/. No code changes.
  2026-09-26  v1.1  Added embedded app icon (browser tab icon + phone home-screen icon).
  2026-09-26  v1.2  When served from a web address, links web/manifest + service worker so the game
                    installs on a phone as an app and works offline. No effect when opened as a file.
-->

<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#1c1e22; --muted:#6a6f77;
  --line:#d6d3cc; --thick:#3b3f46; --accent:#2f6bd6; --accent-ink:#ffffff;
  --accent-soft:#dde7fa; --peer:#eef1f5; --same:#c8d8f6; --user:#2553ad;
  --err:#c7362b; --err-bg:#fbe2df; --btn:#ebe9e3; --btn-hover:#e1ded6;
  --board:min(calc(100vw - 32px), 468px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --surface:#1f2227; --ink:#e7e8eb; --muted:#99a0a9;
    --line:#343840; --thick:#8b919a; --accent:#6d9df0; --accent-ink:#0e1522;
    --accent-soft:#233452; --peer:#262a31; --same:#2e4166; --user:#93b7f6;
    --err:#ff7d70; --err-bg:#3d2323; --btn:#272b31; --btn-hover:#30353c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1f2227; --ink:#e7e8eb; --muted:#99a0a9;
  --line:#343840; --thick:#8b919a; --accent:#6d9df0; --accent-ink:#0e1522;
  --accent-soft:#233452; --peer:#262a31; --same:#2e4166; --user:#93b7f6;
  --err:#ff7d70; --err-bg:#3d2323; --btn:#272b31; --btn-hover:#30353c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:calc(var(--board) + 0px);margin:0 auto;padding:20px 0 32px;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--btn)}
.icon-btn:hover{background:var(--btn-hover)}
.icon-btn svg{width:18px;height:18px}

.newgame{display:flex;gap:8px;align-items:stretch}
.seg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--btn);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 2px;border-radius:8px;font-size:.85rem;color:var(--muted);font-weight:600}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 14px;font-weight:650;font-size:.9rem;white-space:nowrap}
.primary:hover{filter:brightness(1.07)}

.status{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.timer{display:flex;align-items:center;gap:8px}
.icon-btn.small{width:28px;height:28px;border-radius:8px}
.icon-btn.small svg{width:14px;height:14px}

.board-wrap{position:relative;width:var(--board);height:var(--board)}
.board{
  width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:2px;background:var(--thick);border:2px solid var(--thick);border-radius:8px;overflow:hidden;
  user-select:none;touch-action:manipulation;
}
.box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;background:var(--line)}
.cell{
  background:var(--surface);display:grid;place-items:center;position:relative;cursor:pointer;
  font-size:calc(var(--board) / 9 * .56);font-variant-numeric:tabular-nums;line-height:1;
  color:var(--user);font-weight:500;transition:background-color .08s;
}
.cell.given{color:var(--ink);font-weight:650}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.err.sel{box-shadow:inset 0 0 0 2px var(--err)}
.cell.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.notes span{display:grid;place-items:center;font-size:calc(var(--board) / 9 * .24);color:var(--muted);font-weight:500;border-radius:3px}
.notes span.hl{color:var(--accent-ink);background:var(--accent)}

.overlay{
  position:absolute;inset:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;padding:24px
}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.overlay .primary{padding:11px 22px;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px;color:var(--muted);font-size:.85rem}
.stats b{display:block;color:var(--ink);font-size:1.25rem;font-variant-numeric:tabular-nums}
.best{color:var(--muted);font-size:.9rem;margin:0}
.best.new{color:var(--accent);font-weight:650}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;font-size:.8rem;color:var(--muted);font-weight:600;position:relative}
.tool:hover{background:var(--btn)}
.tool svg{width:22px;height:22px;color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool[aria-pressed="true"] svg{color:var(--accent)}
.tool:disabled{opacity:.4;cursor:default}
.tool:disabled:hover{background:none}

.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{
  background:var(--btn);border-radius:10px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:calc(var(--board) / 9 * .5);font-weight:550;color:var(--accent);gap:2px
}
.pad button:hover{background:var(--btn-hover)}
.pad button small{font-size:.62rem;color:var(--muted);font-weight:600}
.pad button.done{visibility:hidden}
.notes-on .pad button{color:var(--muted)}

.keys{margin:4px 0 0;color:var(--muted);font-size:.78rem;text-align:center;line-height:1.6}
kbd{font:inherit;font-size:.72rem;padding:1px 5px;border-radius:4px;background:var(--btn);color:var(--ink)}
@media (max-width:420px){.keys{display:none}}
@media (prefers-reduced-motion: reduce){.cell.pop{animation:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <h1>Sudoku</h1>
    <button id="themeBtn" class="icon-btn" aria-label="Switch light or dark theme" title="Switch theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>

  <section class="newgame">
    <div class="seg" role="radiogroup" aria-label="Difficulty for new game" id="seg">
      <button role="radio" data-level="easy">Easy</button>
      <button role="radio" data-level="medium">Medium</button>
      <button role="radio" data-level="hard">Hard</button>
      <button role="radio" data-level="expert">Expert</button>
    </div>
    <button id="newBtn" class="primary">New game</button>
  </section>

  <div class="status">
    <span id="levelLabel">Medium</span>
    <span>Mistakes <b id="mistakes">0</b></span>
    <span class="timer"><b id="timer">0:00</b>
      <button id="pauseBtn" class="icon-btn small" aria-label="Pause" title="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </span>
  </div>

  <div class="board-wrap">
    <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
    <div id="pauseOverlay" class="overlay" hidden>
      <h2>Paused</h2>
      <button id="resumeBtn" class="primary">Resume</button>
    </div>
    <div id="winOverlay" class="overlay" hidden>
      <h2>Solved!</h2>
      <div class="stats">
        <span><b id="wTime">0:00</b>Time</span>
        <span><b id="wMistakes">0</b>Mistakes</span>
        <span><b id="wHints">0</b>Hints</span>
      </div>
      <p class="best" id="wBest"></p>
      <button id="winNewBtn" class="primary">Play again</button>
    </div>
  </div>

  <div class="tools">
    <button id="undoBtn" class="tool" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="eraseBtn" class="tool" title="Erase (Backspace)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9L4 15a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/><path d="m7 9 8 8"/></svg>Erase</button>
    <button id="notesBtn" class="tool" aria-pressed="false" title="Notes (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span id="notesLabel">Notes: off</span></button>
    <button id="hintBtn" class="tool" title="Hint (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
  </div>

  <div id="pad" class="pad" aria-label="Number pad"></div>

  <p class="keys"><kbd>1</kbd>–<kbd>9</kbd> enter · <kbd>←↑→↓</kbd> move · <kbd>N</kbd> notes · <kbd>Backspace</kbd> erase · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>H</kbd> hint · <kbd>P</kbd> pause</p>
</main>

<script>
"use strict";
/* ---------- Geometry ---------- */
const ROW = [], COL = [], BOX = [];
for (let i = 0; i < 81; i++) { ROW[i] = (i / 9) | 0; COL[i] = i % 9; BOX[i] = ((ROW[i] / 3) | 0) * 3 + ((COL[i] / 3) | 0); }
const PEERS = [];
for (let i = 0; i < 81; i++) {
  const p = [];
  for (let j = 0; j < 81; j++) if (j !== i && (ROW[j] === ROW[i] || COL[j] === COL[i] || BOX[j] === BOX[i])) p.push(j);
  PEERS.push(p);
}
const LEVELS = { easy: { name: "Easy", clues: 40 }, medium: { name: "Medium", clues: 32 }, hard: { name: "Hard", clues: 27 }, expert: { name: "Expert", clues: 23 } };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function bits(m) { let c = 0; while (m) { m &= m - 1; c++; } return c; }

/* ---------- Solver: counts solutions up to `limit` (bitmask + fewest-candidates-first) ---------- */
function countSolutions(grid, limit) {
  const g = grid.slice(), rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
  for (let i = 0; i < 81; i++) if (g[i]) {
    const b = 1 << g[i];
    if ((rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & b) return 0;
    rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b;
  }
  let count = 0;
  (function solve() {
    let best = -1, bestMask = 0, bestN = 10;
    for (let i = 0; i < 81; i++) if (!g[i]) {
      const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & 0x3FE, n = bits(m);
      if (n < bestN) { best = i; bestMask = m; bestN = n; if (n <= 1) break; }
    }
    if (best < 0) { count++; return; }
    if (bestN === 0) return;
    const r = ROW[best], c = COL[best], x = BOX[best];
    for (let d = 1; d <= 9; d++) {
      const b = 1 << d;
      if (!(bestMask & b)) continue;
      g[best] = d; rows[r] |= b; cols[c] |= b; boxes[x] |= b;
      solve();
      g[best] = 0; rows[r] &= ~b; cols[c] &= ~b; boxes[x] &= ~b;
      if (count >= limit) return;
    }
  })();
  return count;
}

/* ---------- Generator ---------- */
function solvedGrid() {
  const g = new Array(81).fill(0), rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
  (function fill(i) {
    if (i === 81) return true;
    for (const d of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
      const b = 1 << d;
      if ((rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & b) continue;
      g[i] = d; rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b;
      if (fill(i + 1)) return true;
      g[i] = 0; rows[ROW[i]] &= ~b; cols[COL[i]] &= ~b; boxes[BOX[i]] &= ~b;
    }
    return false;
  })(0);
  return g;
}
function carve(solution, target) {
  const p = solution.slice();
  let clues = 81;
  // Remove cells in symmetric pairs where possible so the puzzle looks balanced.
  for (const i of shuffle([...Array(41).keys()])) {
    if (clues <= target) break;
    const j = 80 - i, pair = i === j ? [i] : [i, j];
    const saved = pair.map(k => p[k]);
    pair.forEach(k => (p[k] = 0));
    if (countSolutions(p, 2) === 1) clues -= pair.length;
    else pair.forEach((k, n) => (p[k] = saved[n]));
  }
  // Top up with single removals if symmetric pass stopped short.
  for (const i of shuffle([...Array(81).keys()])) {
    if (clues <= target) break;
    if (!p[i]) continue;
    const v = p[i]; p[i] = 0;
    if (countSolutions(p, 2) === 1) clues--; else p[i] = v;
  }
  return { puzzle: p, clues };
}
function makePuzzle(level) {
  const target = LEVELS[level].clues, tries = level === "expert" ? 6 : level === "hard" ? 3 : 1;
  let best = null;
  for (let t = 0; t < tries; t++) {
    const solution = solvedGrid(), r = carve(solution, target);
    if (!best || r.clues < best.clues) best = { puzzle: r.puzzle, solution, clues: r.clues };
    if (r.clues <= target) break;
  }
  return best;
}

/* ---------- Storage (safe if unavailable) ---------- */
const KEY = "aios-sudoku-game-v1", BEST_KEY = "aios-sudoku-best-v1", THEME_KEY = "aios-sudoku-theme", LEVEL_KEY = "aios-sudoku-level";
function load(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- State ---------- */
let S = null;
let pickedLevel = load(LEVEL_KEY) || "medium";
function newGame(level) {
  const g = makePuzzle(level);
  S = {
    level, puzzle: g.puzzle, solution: g.solution, values: g.puzzle.slice(), notes: new Array(81).fill(0),
    sel: -1, notesMode: S ? S.notesMode : false, mistakes: 0, hints: 0, elapsed: 0, done: false, paused: false, history: []
  };
  S.sel = S.values.indexOf(0);
  $("#winOverlay").hidden = true; $("#pauseOverlay").hidden = true;
  save(); render();
}
function save() { if (S) store(KEY, S); }

/* ---------- DOM ---------- */
function $(s) { return document.querySelector(s); }
const boardEl = $("#board"), padEl = $("#pad"), cells = [];
(function build() {
  const boxes = [];
  for (let b = 0; b < 9; b++) { const el = document.createElement("div"); el.className = "box"; el.setAttribute("role", "presentation"); boxes.push(el); boardEl.appendChild(el); }
  for (let i = 0; i < 81; i++) {
    const c = document.createElement("div");
    c.className = "cell"; c.setAttribute("role", "gridcell"); c.dataset.i = i;
    c.addEventListener("pointerdown", e => { e.preventDefault(); select(i); });
    boxes[BOX[i]].appendChild(c); cells.push(c);
  }
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement("button");
    b.innerHTML = d + "<small></small>"; b.dataset.d = d; b.setAttribute("aria-label", "Enter " + d);
    b.addEventListener("click", () => enter(d));
    padEl.appendChild(b);
  }
})();

function fmt(s) { const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }

function render(popIdx) {
  const sel = S.sel, sv = sel >= 0 ? S.values[sel] : 0;
  for (let i = 0; i < 81; i++) {
    const c = cells[i], v = S.values[i], given = !!S.puzzle[i], wrong = v && !given && v !== S.solution[i];
    let cls = "cell";
    if (given) cls += " given";
    if (sel >= 0 && i !== sel && (ROW[i] === ROW[sel] || COL[i] === COL[sel] || BOX[i] === BOX[sel])) cls += " peer";
    if (sv && v === sv && i !== sel) cls += " same";
    if (i === sel) cls += " sel";
    if (wrong) cls += " err";
    if (i === popIdx) cls += " pop";
    c.className = cls;
    if (v) { if (c.textContent !== String(v) || c.firstElementChild) c.textContent = v; }
    else if (S.notes[i]) {
      let h = '<div class="notes">';
      for (let d = 1; d <= 9; d++) h += "<span" + (S.notes[i] & (1 << d) && d === sv ? ' class="hl"' : "") + ">" + (S.notes[i] & (1 << d) ? d : "") + "</span>";
      c.innerHTML = h + "</div>";
    } else c.textContent = "";
    c.setAttribute("aria-label", "Row " + (ROW[i] + 1) + ", column " + (COL[i] + 1) + ": " + (v ? v + (given ? " (given)" : wrong ? " (incorrect)" : "") : "empty"));
    c.setAttribute("aria-selected", i === sel ? "true" : "false");
  }
  const counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) if (S.values[i] && S.values[i] === S.solution[i]) counts[S.values[i]]++;
  padEl.querySelectorAll("button").forEach(b => {
    const d = +b.dataset.d, left = 9 - counts[d];
    b.querySelector("small").textContent = left;
    b.classList.toggle("done", left === 0);
  });
  $("#mistakes").textContent = S.mistakes;
  $("#levelLabel").textContent = LEVELS[S.level].name;
  $("#timer").textContent = fmt(S.elapsed);
  $("#notesBtn").setAttribute("aria-pressed", S.notesMode);
  $("#notesLabel").textContent = "Notes: " + (S.notesMode ? "on" : "off");
  document.body.classList.toggle("notes-on", S.notesMode);
  $("#undoBtn").disabled = !S.history.length || S.done;
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-checked", b.dataset.level === pickedLevel));
}

/* ---------- Actions ---------- */
function locked(i) { return !!S.puzzle[i] || (S.values[i] && S.values[i] === S.solution[i]); }
function busy() { return S.done || S.paused; }
function pushHist(list) { S.history.push(list.map(i => [i, S.values[i], S.notes[i]])); if (S.history.length > 400) S.history.shift(); }
function select(i) { if (busy()) return; S.sel = i; render(); }

function place(i, d) {
  const b = 1 << d, touched = [i].concat(PEERS[i].filter(p => !S.values[p] && S.notes[p] & b));
  pushHist(touched);
  S.values[i] = d; S.notes[i] = 0;
  for (let k = 1; k < touched.length; k++) S.notes[touched[k]] &= ~b;
}
function enter(d) {
  const i = S.sel;
  if (busy() || i < 0 || locked(i)) return;
  if (S.notesMode) {
    if (S.values[i]) return;
    pushHist([i]); S.notes[i] ^= 1 << d;
    save(); render(); return;
  }
  if (S.values[i] === d) return;
  place(i, d);
  if (d !== S.solution[i]) S.mistakes++;
  save(); render(i); checkWin();
}
function erase() {
  const i = S.sel;
  if (busy() || i < 0 || locked(i) || (!S.values[i] && !S.notes[i])) return;
  pushHist([i]); S.values[i] = 0; S.notes[i] = 0;
  save(); render();
}
function undo() {
  if (busy() || !S.history.length) return;
  const last = S.history.pop();
  last.forEach(([i, v, n]) => { S.values[i] = v; S.notes[i] = n; });
  S.sel = last[0][0];
  save(); render();
}
function hint() {
  if (busy()) return;
  const open = i => S.values[i] !== S.solution[i];
  let i = S.sel >= 0 && open(S.sel) ? S.sel : -1;
  if (i < 0) { const list = []; for (let k = 0; k < 81; k++) if (open(k)) list.push(k); if (!list.length) return; i = list[(Math.random() * list.length) | 0]; }
  place(i, S.solution[i]); S.hints++; S.sel = i;
  save(); render(i); checkWin();
}
function toggleNotes() { if (S.done) return; S.notesMode = !S.notesMode; save(); render(); }
function setPaused(p) {
  if (S.done) return;
  S.paused = p; $("#pauseOverlay").hidden = !p; save(); render();
}
function move(dr, dc) {
  if (busy()) return;
  const i = S.sel < 0 ? 40 : S.sel, r = (ROW[i] + dr + 9) % 9, c = (COL[i] + dc + 9) % 9;
  select(r * 9 + c);
}
function checkWin() {
  for (let i = 0; i < 81; i++) if (S.values[i] !== S.solution[i]) return;
  S.done = true; S.sel = -1;
  const best = load(BEST_KEY) || {}, prev = best[S.level], isNew = !prev || S.elapsed < prev;
  if (isNew) { best[S.level] = S.elapsed; store(BEST_KEY, best); }
  $("#wTime").textContent = fmt(S.elapsed); $("#wMistakes").textContent = S.mistakes; $("#wHints").textContent = S.hints;
  const wb = $("#wBest");
  wb.textContent = isNew ? (prev ? "New best " + LEVELS[S.level].name + " time!" : "First " + LEVELS[S.level].name + " win — best time set.") : "Best " + LEVELS[S.level].name + " time: " + fmt(prev);
  wb.classList.toggle("new", isNew);
  save(); render();
  setTimeout(() => { $("#winOverlay").hidden = false; }, 350);
}

/* ---------- Wiring ---------- */
$("#newBtn").addEventListener("click", () => newGame(pickedLevel));
$("#winNewBtn").addEventListener("click", () => newGame(pickedLevel));
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => { pickedLevel = b.dataset.level; store(LEVEL_KEY, pickedLevel); render(); }));
$("#undoBtn").addEventListener("click", undo);
$("#eraseBtn").addEventListener("click", erase);
$("#notesBtn").addEventListener("click", toggleNotes);
$("#hintBtn").addEventListener("click", hint);
$("#pauseBtn").addEventListener("click", () => setPaused(true));
$("#resumeBtn").addEventListener("click", () => setPaused(false));

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-9]$/.test(k)) { enter(+k); }
  else if (/^Numpad[1-9]$/.test(e.code)) { enter(+e.code.slice(6)); }
  else if (k === "Backspace" || k === "Delete" || k === "0") erase();
  else if (k === "ArrowUp") move(-1, 0);
  else if (k === "ArrowDown") move(1, 0);
  else if (k === "ArrowLeft") move(0, -1);
  else if (k === "ArrowRight") move(0, 1);
  else if (k === "n" || k === "N") toggleNotes();
  else if (k === "h" || k === "H") hint();
  else if (k === "p" || k === "P" || k === "Escape") setPaused(!S.paused);
  else return;
  e.preventDefault();
});

/* Timer: only counts while the page is visible and the game is active. */
setInterval(() => {
  if (!S || S.done || S.paused || document.visibilityState !== "visible") return;
  S.elapsed++;
  $("#timer").textContent = fmt(S.elapsed);
  if (S.elapsed % 5 === 0) save();
}, 1000);
window.addEventListener("pagehide", save);

/* Theme */
(function theme() {
  const root = document.documentElement, saved = load(THEME_KEY);
  if (saved) root.dataset.theme = saved;
  $("#themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store(THEME_KEY, root.dataset.theme);
  });
})();

/* Phone app install: only when served over http(s) (e.g. GitHub Pages), never from a local file. */
if (/^https?:$/.test(location.protocol)) {
  const m = document.createElement("link"); m.rel = "manifest"; m.href = "manifest.webmanifest"; document.head.appendChild(m);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* Start: resume an unfinished game, otherwise start a fresh one. */
(function start() {
  const saved = load(KEY);
  if (saved && !saved.done && Array.isArray(saved.values) && saved.values.length === 81 && LEVELS[saved.level]) {
    S = saved; S.paused = false; render();
  } else newGame(pickedLevel);
})();
</script>
</body>
</html>
